<!doctype html>
<html lang="ja">
  <head>

    <!-- X (Twitter) Player Card -->

    <meta name="twitter:title" content="Code Defender" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Code Defender" />
